<!DOCTYPE html>
<html>
<head>
    <title>SOC DASHBOARD</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #0b1220, #05070f);
            color: #e6f1ff;
            font-family: 'Segoe UI', sans-serif;
        }

        h2 {
            text-align: center;
            padding: 20px;
            margin: 0;
            color: #00e5ff;
            text-shadow: 0 0 15px #00e5ff;
            letter-spacing: 2px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 25px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            height: 420px;
            overflow-y: auto;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.1);
        }

        .panel h3 {
            margin-top: 0;
            color: #7dd3fc;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        /* LOG ITEMS */
        #logBox div {
            padding: 8px;
            margin: 8px 0;
            background: rgba(0, 229, 255, 0.06);
            border-left: 4px solid #00e5ff;
            border-radius: 6px;
            transition: 0.3s;
        }

        #logBox div:hover {
            transform: translateX(5px);
            background: rgba(0, 229, 255, 0.12);
        }

        /* ML CARDS */
        .card {
            background: linear-gradient(135deg, #0f172a, #111c33);
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #22c55e;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0,229,255,0.2);
        }

        .danger {
            border-left: 4px solid #ef4444 !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* SCROLLBAR (optional but aesthetic) */
        .panel::-webkit-scrollbar {
            width: 6px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: #00e5ff;
            border-radius: 10px;
        }

        .panel::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>

<h2>🛡 SOC SECURITY MONITOR DASHBOARD</h2>

<div class="container">

    <div class="panel">
        <h3>📡 Logs</h3>
        <div id="logBox"></div>
    </div>

    <div class="panel">
        <h3>🧠 ML Detection</h3>
        <div id="mlBox"></div>
    </div>

</div>

<script>

function update(){

    fetch("http://127.0.0.1:5000/logs")
    .then(res => res.json())
    .then(data => {

        let logBox = document.getElementById("logBox");
        let mlBox = document.getElementById("mlBox");

        logBox.innerHTML = "";
        mlBox.innerHTML = "";

        data.forEach(entry => {

            logBox.innerHTML += `<div>📄 ${entry.file}</div>`;

            mlBox.innerHTML += `
                <div class="card ${entry.result === 'ALERT' ? 'danger' : ''}">
                    📄 ${entry.file} <br>
                    🧠 ${entry.result} <br>
                    📊 Score: ${entry.score}
                </div>
            `;
        });

    });

}

setInterval(update, 1000);

</script>

</body>
</html>
